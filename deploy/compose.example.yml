# Hosted edward behind a reverse proxy on the same machine, which must pass the original Host header through.
# Before the first start: `mkdir -p data/claude-workflow-dashboard`, write its config.json and .env, then
# `chmod 700 data/claude-workflow-dashboard && chmod 600 data/claude-workflow-dashboard/.env && sudo chown -R 1000:1000 data`.
# It holds the accounts database and every account's file, the only copy: back it up.
services:
  edward:
    build: ..
    image: edward-hosted
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - ./data:/data
